<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administração · Mundo Martinho</title>
<style>
:root{color-scheme:dark;--bg:#050914;--panel:#0b1426;--line:#1d3151;--muted:#91a4c2;--blue:#168bff;--cyan:#22d3ee;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#102d55 0,transparent 42%),var(--bg);color:#eef5ff;font:15px/1.5 Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:54px;height:38px;object-fit:contain}.muted{color:var(--muted)}.panel{background:#0a1425eF;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 70px #0006}.login{max-width:430px;margin:8vh auto}.h{font-size:1.7rem;margin:0}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:.88rem;color:#b8c8df}.field input,.field textarea,.field select{width:100%;background:#050c19;color:white;border:1px solid #294263;border-radius:10px;padding:12px;outline:none}.field textarea{min-height:110px;resize:vertical}.btn{border:1px solid #2763a0;background:linear-gradient(120deg,#1263bd,#087fba);color:#fff;padding:10px 15px;border-radius:10px;font-weight:650}.btn.secondary{background:#111e32;border-color:#30445f}.btn.danger{background:#39151d;border-color:#73313b}.btn:disabled{opacity:.5;cursor:not-allowed}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button.active{background:#164d86;border-color:#2995ed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.item{background:#081222;border:1px solid var(--line);border-radius:13px;padding:15px}.item h3{margin:0 0 6px}.item p{margin:5px 0;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}.notice{padding:12px 14px;border-radius:10px;background:#112a43;border:1px solid #24517a;margin:14px 0}.notice.error{background:#351820;border-color:#713440}.notice.ok{background:#103027;border-color:#21644e}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.preview{max-width:180px;max-height:120px;border-radius:9px;object-fit:cover}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.wrap{padding:14px}.panel{padding:16px}.split{grid-template-columns:1fr}.top{align-items:flex-start}}
</style></head><body><main class="wrap">
<header class="top"><div class="brand"><img src="logo.webp" alt=""><div><b>MUNDO MARTINHO</b><div class="muted" style="font-size:.8rem">Painel de administração</div></div></div><button id="logout" class="btn secondary hidden">Terminar sessão</button></header>
<section id="login" class="panel login"><h1 class="h">Acesso administrativo</h1><p class="muted">Área privada. Apenas a conta de administrador autorizada pode gerir a plataforma.</p><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label for="password">Palavra-passe</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn" style="width:100%">Entrar</button><div id="loginMsg" class="notice hidden"></div><p class="muted" style="font-size:.8rem">Configure primeiro o Supabase seguindo o ficheiro CONFIGURAR-SUPABASE.md.</p></section>
<section id="app" class="hidden"><div class="panel"><div class="bar"><div><h1 class="h">Centro de controlo</h1><span class="muted">Gerir conteúdos publicados no site</span></div><span id="who" class="muted"></span></div><div id="msg" class="notice hidden"></div>
<nav class="tabs"><button class="btn secondary active" data-tab="services">Serviços</button><button class="btn secondary" data-tab="portfolio">Portfólio</button><button class="btn secondary" data-tab="feedbacks">Feedbacks</button></nav>
<div class="bar"><h2 id="sectionTitle">Serviços</h2><button id="add" class="btn">+ Adicionar</button></div><div id="list" class="grid" style="margin-top:14px"></div>
</div>
<section id="editor" class="panel hidden" style="margin-top:16px"><div class="bar"><h2 id="editorTitle">Novo registo</h2><button id="closeEditor" class="btn secondary">Fechar</button></div><form id="form"><div id="fields"></div><div class="actions"><button class="btn" type="submit">Guardar e publicar</button><button class="btn secondary" type="button" id="cancel">Cancelar</button></div></form></section></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
(()=>{'use strict';const $=s=>document.querySelector(s),cfg=window.MM_SUPABASE||{};let sb=null,user=null,tab='services',rows=[],editing=null;
const schemas={services:{table:'mm_services',title:'Serviços',fields:[['name','Nome','text',true],['desc','Descrição','textarea',true],['category','Categoria','text',true],['price','Preço apresentado','text',true],['priceFrom','Preço numérico (Kz)','number'],['badge','Etiqueta','text'],['image','Imagem (ficheiro ou URL)','text'],['popular','Mais procurado','checkbox'],['features','Características (uma por linha)','lines'],['name_en','Nome em inglês','text'],['desc_en','Descrição em inglês','textarea'],['price_en','Preço em inglês','text']]},portfolio:{table:'mm_portfolio',title:'Portfólio',fields:[['title','Título','text',true],['title_en','Título em inglês','text'],['category','Categoria','text',true],['client','Cliente','text'],['description','Descrição','textarea',true],['description_en','Descrição em inglês','textarea'],['result','Resultado','text'],['result_en','Resultado em inglês','text'],['image','Imagem de capa (ficheiro ou URL)','text'],['images','Imagens adicionais (uma por linha)','lines'],['date','Data','date'],['link','Link do projeto','url'],['tags','Etiquetas (uma por linha)','lines']]},feedbacks:{table:'mm_feedbacks',title:'Feedbacks',fields:[['name','Nome do cliente','text',true],['role','Cargo / empresa','text'],['rating','Avaliação (1–5)','number',true],['text','Testemunho','textarea'],['text_en','Testemunho em inglês','textarea'],['image','Imagem/print (ficheiro ou URL)','text'],['project','Projeto','text'],['project_en','Projeto em inglês','text'],['date','Data','date']]}};
function say(t,kind=''){const e=$('#msg');e.textContent=t;e.className='notice '+kind;e.classList.remove('hidden')}function loginSay(t){const e=$('#loginMsg');e.textContent=t;e.classList.remove('hidden')}
function ready(){return cfg.url&&cfg.anonKey&&!cfg.url.includes('COLOQUE')&&!cfg.anonKey.includes('COLOQUE')&&window.supabase}
function mediaUrl(path){return path||''}
async function init(){if(!ready()){$('#loginBtn').disabled=true;loginSay('Falta configurar supabase-config.js com Project URL, chave anon/public e UUID do administrador.');return}sb=window.supabase.createClient(cfg.url,cfg.anonKey);const {data}=await sb.auth.getSession();if(data.session)await accept(data.session.user)}
async function accept(u){if(!u||!cfg.adminUserId||u.id!==cfg.adminUserId){await sb.auth.signOut();$('#app').classList.add('hidden');$('#login').classList.remove('hidden');loginSay('Esta conta não está autorizada como administradora.');return}user=u;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');$('#who').textContent=u.email||'Administrador';await load()}
$('#loginBtn').onclick=async()=>{if(!sb)return;const b=$('#loginBtn');b.disabled=true;const {data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});b.disabled=false;if(error){loginSay('Não foi possível entrar: '+error.message);return}await accept(data.user)};
$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function load(){const s=schemas[tab];$('#sectionTitle').textContent=s.title;const {data,error}=await sb.from(s.table).select('*').order('updated_at',{ascending:false});if(error){say('Erro ao carregar: '+error.message,'error');return}rows=data||[];render()}
function render(){const s=schemas[tab];$('#list').innerHTML=rows.length?rows.map((r,i)=>{const d=r.data||{},name=d.name||d.title||'Sem título',desc=d.desc||d.description||d.text||d.category||'';return `<article class="item"><h3>${esc(name)}</h3><p>${esc(desc).slice(0,180)}</p><div class="actions"><button class="btn secondary" data-edit="${i}">Editar</button><button class="btn danger" data-del="${i}">Eliminar</button></div></article>`}).join(''):'<p class="muted">Ainda não existem registos nesta secção.</p>';$('#list').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(rows[+b.dataset.edit]));$('#list').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>remove(rows[+b.dataset.del]))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openEditor(row=null){editing=row;const d=row?.data||{},s=schemas[tab];$('#editorTitle').textContent=row?'Editar registo':'Novo registo';$('#fields').innerHTML=s.fields.map(([k,label,type,required])=>{const v=d[k]??(k==='date'?new Date().toISOString().slice(0,10):k==='rating'?5:k==='popular'?false:'');if(type==='checkbox')return `<label class="field"><span>${label}</span><input name="${k}" type="checkbox" ${v?'checked':''}></label>`;if(type==='textarea'||type==='lines')return `<label class="field">${label}<textarea name="${k}" ${required?'required':''}>${esc(Array.isArray(v)?v.join('\n'):v)}</textarea></label>`;return `<label class="field">${label}<input name="${k}" type="${type==='number'?'number':type==='date'?'date':type==='url'?'url':'text'}" name="${k}" value="${esc(v)}" ${required?'required':''}></label>`}).join('')+`<label class="field">Imagem para enviar<input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp"><small class="muted">Opcional. O ficheiro será enviado para o armazenamento Supabase e o caminho será preenchido automaticamente.</small><img id="imagePreview" class="preview" hidden></label>`;$('#editor').classList.remove('hidden');$('#editor').scrollIntoView({behavior:'smooth'});$('#imageFile').onchange=previewUpload}
function previewUpload(e){const f=e.target.files[0],im=$('#imagePreview');if(!f){im.hidden=true;return}im.src=URL.createObjectURL(f);im.hidden=false}
$('#add').onclick=()=>openEditor();$('#closeEditor').onclick=$('#cancel').onclick=()=>$('#editor').classList.add('hidden');
async function uploadImage(file){if(!file)return null;if(file.size>8*1024*1024)throw new Error('A imagem deve ter no máximo 8 MB.');const ext=(file.name.split('.').pop()||'webp').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`${tab}/${Date.now()}-${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from('mm-public').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;return sb.storage.from('mm-public').getPublicUrl(path).data.publicUrl}
$('#form').onsubmit=async e=>{e.preventDefault();const s=schemas[tab],fd=new FormData(e.currentTarget),d={};for(const [k,label,type] of s.fields){let v=fd.get(k);if(type==='checkbox')v=fd.has(k);else if(type==='number')v=v===''?0:Number(v);else if(type==='lines')v=String(v||'').split('\n').map(x=>x.trim()).filter(Boolean);else v=String(v||'').trim();if(v!==''&&v!==false)d[k]=v;else if(type==='checkbox')d[k]=false}try{const file=$('#imageFile').files[0];if(file){const url=await uploadImage(file);d.image=url}if(d.image===undefined&&editing?.data?.image)d.image=editing.data.image;const payload={data:d,updated_at:new Date().toISOString()};let q;if(tab==='services'){payload.id=editing?.id??Math.max(0,...rows.map(r=>Number(r.id)||0))+1;q=sb.from(s.table).upsert(payload)}else if(editing)q=sb.from(s.table).update(payload).eq('id',editing.id);else q=sb.from(s.table).insert(payload);const {error}=await q;if(error)throw error;$('#editor').classList.add('hidden');say('Registo guardado. O site público já pode apresentar a atualização.','ok');await load()}catch(err){say('Não foi possível guardar: '+err.message,'error')}};
async function remove(r){if(!confirm('Eliminar este registo? Esta ação não pode ser desfeita.'))return;const {error}=await sb.from(schemas[tab].table).delete().eq('id',r.id);if(error){say('Erro ao eliminar: '+error.message,'error');return}say('Registo eliminado.','ok');await load()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('#editor').classList.add('hidden');await load()});init();
})();
</script></body></html>
