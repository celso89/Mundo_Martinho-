.shq{color:var(--mu);font-size:.85rem;margin-bottom:12px}.dlq{padding:10px 20px;font-size:.9rem;margin-bottom:20px}

.shb{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;color:var(--tx);font-size:.68rem;text-decoration:none}.shb span{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.25rem;color:#fff;font-weight:800;transition:var(--ease)}.shb:hover span{transform:translateY(-3px)}
.shl{display:flex;gap:8px}.shl input{flex:1;min-width:0;padding:11px 14px;background:rgba(0,0,0,.3);border:1px solid var(--bd);border-radius:12px;color:var(--mu);font:inherit;font-size:.85rem}.shl button{background:var(--p);border:0;border-radius:12px;padding:0 16px;color:#fff;font-size:1.1rem}
@media(max-width:1024px){.hero{grid-template-columns:1fr;text-align:center}.hero p{margin-inline:auto}.cta{justify-content:center}.hv{max-width:460px;margin:0 auto}.ql{grid-template-columns:1fr}.sp{position:static}}
@media(max-width:768px){.header{top:0;width:100%;border-radius:0;border-width:0 0 1px;height:64px;padding:0 16px}.nav,.bq{display:none}.mnav{display:flex}.page{padding-top:92px}.hero h1{font-size:2.5rem}.stats{grid-template-columns:1fr}.sh{margin:60px 0 30px}.sh h2{font-size:1.8rem}.fab{bottom:calc(88px + env(safe-area-inset-bottom,0px));right:16px;padding:12px 18px;font-size:.92rem}.toast{top:76px;right:12px}.chip{display:none}.cta2 h2{font-size:1.6rem}.kpi{grid-template-columns:repeat(3,1fr);gap:10px}.kpi .card{padding:14px 6px}.kpi b{font-size:1.4rem}.kpi span{font-size:.72rem}}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ic=n=>`<svg class="i"><use href="#${n}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let C={},SV=[],PJ=[],FB=[],pcat='all',T={},lang=ls.get('mm_lang',(navigator.language||'pt').startsWith('en')?'en':'pt'),cat='all',quote=ls.get('mm_quote',[]),page='servicos',lastTier=0;
const nf=n=>n.toLocaleString(lang==='en'?'en-US':'pt-PT').replace(/\u00a0/g,' ');
const S=p=>lang==='en'&&p.en?{...p,...p.en}:p;
const wa=(txt='')=>`https://wa.me/${C.whatsapp}${txt?'?text='+encodeURIComponent(txt):''}`;
const hello=()=>lang==='en'?'Hello! I would like to know more about your services.':'Olá! Gostaria de saber mais sobre os vossos serviços.';
const q=new URLSearchParams(location.search);
if(q.get('ref'))ls.set('mm_from',q.get('ref').slice(0,12));
if(q.get('src'))ls.set('mm_src',q.get('src').slice(0,12));
let myRef=ls.get('mm_ref','');if(!myRef){myRef='MM-'+Math.random().toString(36).slice(2,6).toUpperCase();ls.set('mm_ref',myRef)}

const getJSON=u=>fetch(u,{cache:'no-cache'}).then(r=>r.ok?r.json():[]).catch(()=>[]);
const prep=a=>(Array.isArray(a)?a:[]).filter(x=>x&&typeof x==='object').sort((x,y)=>String(y.date||'').localeCompare(String(x.date||'')));
const L=(o,k)=>(lang==='en'&&o[k+'_en'])||o[k]||'';
const imgp=(f,d)=>!f?'':/^(https?:|data:|\/)/.test(f)?f:d+'/'+encodeURI(f);
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const fdate=d=>{if(!d)return'';const x=new Date(String(d).length===7?d+'-01':d);return isNaN(x)?'':x.toLocaleDateString(lang==='en'?'en-US':'pt-PT',{month:'short',year:'numeric'})};
const rate=f=>Math.min(5,Math.max(1,+f.rating||5));
const stars=n=>`<span class="stars" role="img" aria-label="${n}/5">${[1,2,3,4,5].map(i=>`<svg class="i ${i<=n?'on':''}"><use href="#star"/></svg>`).join('')}</span>`;
function pjCard(p){
 const im=imgp(p.image,'portfolio'),t=L(p,'title'),r=L(p,'result'),c=T.categories.find(x=>x.id===p.category),u=safeUrl(p.link),tg=Array.isArray(p.tags)?p.tags:[],ex=Array.isArray(p.images)?p.images:[];
 return `<article class="card pj">${im?`<button class="im" data-z="${esc(im)}" aria-label="${esc(t)}"><img data-fb src="${esc(im)}" alt="${esc(t)}" loading="lazy" decoding="async"></button>`:`<div class="im"><div class="ph">${ic('globe')}</div></div>`}${ex.length?`<div class="th"><small>${esc(T.shots)}</small>${ex.map(x=>`<button data-z="${esc(imgp(x,'portfolio'))}" aria-label="${esc(t)}"><img data-fb src="${esc(imgp(x,'portfolio'))}" alt="" loading="lazy" decoding="async"></button>`).join('')}</div>`:''}
 <div class="pb"><div class="sb">${esc([c&&c.name,fdate(p.date)].filter(Boolean).join(' · '))}</div><h3>${esc(t)}</h3>${p.client?`<small class="cl">${esc(p.client)}</small>`:''}<p>${esc(L(p,'description'))}</p>${r?`<div class="res">${ic('check')}${esc(r)}</div>`:''}${tg.length?`<div class="tags">${tg.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}${u?`<a class="lk" href="${esc(u)}" target="_blank" rel="noopener">${esc(T.viewProject)} ↗</a>`:''}</div></article>`;
}
function fbCard(f){
 const nm=f.name||'',tx=L(f,'text'),im=imgp(f.image,'feedbacks'),pr=L(f,'project'),ini=nm.split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase();
 return `<figure class="card fb"><div class="top"><span class="av">${esc(ini)}</span><div><b>${esc(nm)}</b><small>${esc(f.role||'')}</small></div></div>${stars(rate(f))}${tx?`<blockquote>“${esc(tx)}”</blockquote>`:''}${im?`<button class="fbimg" data-z="${esc(im)}" aria-label="${esc(T.viewChat)}"><img data-fb src="${esc(im)}" alt="${esc(T.viewChat)}" loading="lazy" decoding="async"></button>`:''}${pr?`<small class="pr">${ic('check')} ${esc(pr)}</small>`:''}</figure>`;
}
function kpi(){
 const a=FB.length?(FB.reduce((s,f)=>s+rate(f),0)/FB.length).toFixed(1):'';
 return [PJ.length&&[PJ.length,T.kpiProj],FB.length&&[FB.length,T.kpiFb],a&&[a+'/5',T.kpiAvg]].filter(Boolean).map(([v,l])=>`<div class="card"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('');
}
const ctaBox=()=>`<div class="card cta2"><h2>${esc(T.ctaTitle)}</h2><p>${esc(T.ctaDesc)}</p><button class="b2" onclick="go('orcamento')">${ic('file')}${esc(T.btnQuote)}</button></div>`;
function homeShow(){
 return (PJ.length?`<div class="sh"><h2>${esc(T.projTitle)}</h2><p>${esc(T.projSub)}</p></div><div class="pjg">${PJ.slice(0,3).map(p=>pjCard(p)).join('')}</div>`:'')
 +(FB.length?`<div class="sh"><h2>${esc(T.fbTitle)}</h2><p>${esc(T.fbSub)}</p></div><div class="fbg">${FB.slice(0,3).map(f=>fbCard(f)).join('')}</div>`:'')
 +(PJ.length||FB.length?`<div class="more"><button class="b1" data-p="projetos">${esc(T.seeAll)}</button></div>`:'');
}
function renderShowcase(){
 const el=$('#show');if(!el)return;
 const cats=T.categories.filter(c=>c.id==='all'||PJ.some(p=>p.category===c.id));if(!cats.some(c=>c.id===pcat))pcat='all';
 const pl=PJ.filter(p=>pcat==='all'||p.category===pcat);
 el.innerHTML=`<div class="sh" style="margin-top:0"><h2>${esc(T.showTitle)}</h2><p>${esc(T.showSub)}</p></div>${PJ.length||FB.length?`<div class="kpi">${kpi()}</div>`:`<div class="empty">${ic('star')}${esc(T.showEmpty)}</div>`}
 ${PJ.length?`<div class="sh" style="margin:56px 0 30px"><h2>${esc(T.projTitle)}</h2></div>${cats.length>2?`<div class="cats" role="group">${cats.map(c=>`<button class="cat ${pcat===c.id?'on':''}" data-pc="${c.id}">${esc(c.name)}</button>`).join('')}</div>`:''}<div class="pjg">${pl.map(p=>pjCard(p)).join('')}</div>`:''}
 ${FB.length?`<div class="sh" style="margin:70px 0 30px"><h2>${esc(T.fbTitle)}</h2><p>${esc(T.fbSub)}</p></div><div class="fbg">${FB.map(f=>fbCard(f)).join('')}</div>`:''}${ctaBox()}`;
}
async function load(){
 try{
  const [c,s]=await Promise.all([fetch('config.json').then(r=>{if(!r.ok)throw 0;return r.json()}),fetch('services.json').then(r=>{if(!r.ok)throw 0;return r.json()})]);
  C=c;SV=s;PJ=prep(await getJSON('portfolio.json'));FB=prep(await getJSON('feedbacks.json'));
  // Conteúdos do painel têm prioridade; JSON continua como fallback.
  try{
   const cfg=window.MM_SUPABASE||{};
   if(window.supabase&&cfg.url&&!cfg.url.includes('COLOQUE')&&cfg.anonKey&&!cfg.anonKey.includes('COLOQUE')){
    const db=window.supabase.createClient(cfg.url,cfg.anonKey);
    const [ss,pp,ff]=await Promise.all([
     db.from('mm_services').select('id,data').order('id'),
     db.from('mm_portfolio').select('id,data').order('created_at',{ascending:false}),
     db.from('mm_feedbacks').select('id,data').order('created_at',{ascending:false})
    ]);
    if(!ss.error&&ss.data?.length)SV=ss.data.map(x=>({...x.data,id:x.id}));
    if(!pp.error&&pp.data?.length)PJ=prep(pp.data.map(x=>x.data));
    if(!ff.error&&ff.data?.length)FB=prep(ff.data.map(x=>x.data));
   }
  }catch(err){console.warn('Supabase indisponível; a carregar conteúdo JSON.',err)}
  quote=quote.filter(id=>SV.some(x=>x.id===id));
  $$('[data-p="projetos"]').forEach(b=>b.hidden=!(PJ.length||FB.length));
  $('#yr').textContent=new Date().getFullYear();
  $('#fso').innerHTML=Object.entries(C.social||{}).filter(([,v])=>v).map(([k,v])=>`<a href="${esc(v)}" target="_blank" rel="noopener">${esc(k)}</a>`).join('');
  applyLang();route();lastTier=tiers().un.length;validate(false);
 }catch(e){
  $('#home').innerHTML=`<div class="fail">${ic('lock')}<p>${lang==='en'?'Could not load. Check your connection and try again.':'Não foi possível carregar. Verifique a ligação e tente novamente.'}</p><button class="b1" onclick="load()">${lang==='en'?'Retry':'Tentar novamente'}</button></div>`;
  $('#p-servicos').classList.add('on');
 }
}
function applyLang(){
 T=C.translations[lang];document.documentElement.lang=lang;
 $$('[data-t]').forEach(e=>{if(T[e.dataset.t]!=null)e.textContent=T[e.dataset.t]});
 $$('[data-tp]').forEach(e=>e.placeholder=T[e.dataset.tp]||'');
 $$('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
 $('#fi').textContent=C.hours[lang];
 renderHome();renderAds();renderShowcase();renderQuote();
}
function renderHome(){
 const st=C.stats.map(s=>`<div class="card stat">${ic(s.i)}<b data-n="${s.n}" data-pre="${s.p}" data-suf="${s.s}">${s.p}${s.n}${s.s}</b><span>${esc(T[s.k])}</span></div>`).join('');
 const cats=T.categories.map(c=>`<button class="cat ${cat===c.id?'on':''}" data-c="${c.id}">${esc(c.name)}</button>`).join('');
 const rw=C.rewards.map(r=>`<div class="card rt">${ic('gift')}<b>${r.min}+ ${lang==='en'?'service':'serviço'}${r.min>1?'s':''}</b>${esc(r[lang])}</div>`).join('');
 const steps=T.steps.map(s=>`<div class="card st"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join('');
 const faq=T.faq.map(f=>`<details class="card"><summary>${esc(f[0])}</summary><p>${esc(f[1])}</p></details>`).join('');
 $('#home').innerHTML=`<div class="hero"><div><div class="pill">${ic('star')}${esc(T.heroBadge)}</div><h1>${esc(T.heroTitle)}</h1><p>${esc(T.heroDesc)}</p>
 <div class="cta"><button class="b1" onclick="document.getElementById('sv').scrollIntoView({behavior:'smooth'})">${esc(T.btnExplore)}</button><button class="b2" onclick="go('orcamento')">${ic('file')}${esc(T.btnQuote)}</button></div></div>
 <div class="hv"><img src="logo.webp" alt="Mundo Martinho" width="480" height="307" fetchpriority="high"><span class="chip">${ic('globe')}Sites</span><span class="chip">${ic('bot')}Bot 24h</span><span class="chip">${ic('phone')}Apps</span><span class="chip">${ic('server')}ERP</span></div></div>
 <div class="stats">${st}</div>
 <div class="sh" id="sv"><h2>${esc(T.sectionServices)}</h2><p>${esc(T.sectionSub)}</p></div>
 <div class="cats" role="group">${cats}</div><div class="grid" id="svc-grid"></div>
 ${homeShow()}
 <div class="sh"><h2>${esc(T.rewardsTitle)}</h2></div><div class="rw">${rw}</div>
 <div class="sh"><h2>${esc(T.stepsTitle)}</h2></div><div class="steps">${steps}</div>
 <div class="sh"><h2>${esc(T.faqTitle)}</h2></div><div class="faq">${faq}</div>${ctaBox()}`;
 renderGrid();countUp();
}
function media(p){return p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" decoding="async" width="400" height="400">`:`<div class="ph">${ic(p.icon||'globe')}</div>`}
function renderGrid(){
 const l=SV.filter(p=>cat==='all'||p.category===cat).map(S);
 $("#svc-grid").innerHTML=l.length?l.map(p=>`<article class="card sc">${p.popular?`<span class="pop">${ic('star')}${esc(T.popular)}</span>`:''}<div class="sb">${esc(p.badge)}</div>
 ${p.image?`<button class="im" data-z="${esc(p.image)}" aria-label="${esc(p.name)}">${media(p)}</button>`:`<div class="im" style="aspect-ratio:auto">${media(p)}</div>`}
 <h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><ul class="ft">${(p.features||[]).map(f=>`<li>${ic('check')}${esc(f)}</li>`).join('')}</ul>
 <div class="cf"><b>${esc(p.price)}</b><button class="add ${quote.includes(p.id)?'in':''}" data-a="${p.id}">${quote.includes(p.id)?'✓':'+'} ${esc(T.btnAddQuote)}</button></div></article>`).join(''):`<p class="empty" style="grid-column:1/-1">${esc(T.empty)}</p>`;
}
function renderAds(){
 $('#ag').innerHTML=C.slides.map(s=>{const t=s[lang]||s.pt;return `<article class="card ac"><button data-z="${esc(s.image)}" aria-label="${esc(t.title)}"><img src="${esc(s.image)}" alt="${esc(t.title)}" loading="lazy" decoding="async" width="400" height="400"></button><div><small>${esc(T.updated)}</small><h3>${esc(t.title)}</h3><p>${esc(t.desc)}</p></div></article>`}).join('');
}
function countUp(){
 const els=$$('[data-n]');if(!('IntersectionObserver'in window)||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const el=e.target,n=+el.dataset.n,t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/1100);el.textContent=el.dataset.pre+Math.round(n*(1-Math.pow(1-k,3)))+el.dataset.suf;if(k<1)requestAnimationFrame(f)})(t0)}),{threshold:.6});
 els.forEach(e=>io.observe(e));
}
function toast(m,icon='check'){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.innerHTML=ic(icon)+`<span>${esc(m)}</span>`;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function tiers(){const n=quote.length,rs=[...C.rewards].sort((a,b)=>a.min-b.min);return{n,rs,un:rs.filter(r=>r.min<=n),next:rs.find(r=>r.min>n)}}
function toggle(id){
 const p=S(SV.find(x=>x.id===id));
 if(quote.includes(id)){quote=quote.filter(x=>x!==id);toast(`${p.name} — ✕`,'trash')}
 else{quote.push(id);toast(`"${p.name}" ${T.toastAdded}`);const t=tiers();if(t.un.length>lastTier&&t.un.length>1)setTimeout(()=>toast(`${T.bonusTitle}: ${t.un[t.un.length-1][lang]}`,'gift'),700)}
 lastTier=tiers().un.length;ls.set('mm_quote',quote);renderGrid();renderQuote();
}
function renderQuote(){
 $$('.qc').forEach(e=>e.textContent=quote.length);
 const items=quote.map(id=>S(SV.find(x=>x.id===id)));
 $('#qitems').innerHTML=items.length?items.map(p=>`<div class="card qi">${media(p)}<div><b>${esc(p.name)}</b><span>${esc(p.price)}</span></div><button class="rm" data-r="${p.id}" aria-label="Remover">${ic('trash')}</button></div>`).join(''):`<div class="empty">${ic('file')}${esc(T.quoteEmpty)}<br><br><button class="b1" onclick="go('servicos')">${esc(T.navHome)}</button></div>`;
 const t=tiers(),max=t.rs[t.rs.length-1].min;
 $('#prog').innerHTML=`<h4>${ic('gift')}${esc(T.rewardsTitle)}</h4><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${max}" aria-valuenow="${Math.min(t.n,max)}"><i style="width:${Math.min(100,t.n/max*100)}%"></i></div>
 <p>${t.next?esc(T.rewardsNext.replace('{n}',t.next.min-t.n)):'🎉 '+esc(T.rewardsAll)}</p><ul>${t.rs.map(r=>`<li class="${r.min<=t.n?'ok':''}">${ic(r.min<=t.n?'check':'circle')}<span>${esc(r[lang])}</span></li>`).join('')}</ul>`;
 const sum=items.reduce((a,p)=>a+(p.priceFrom||0),0),od=items.some(p=>!p.priceFrom);
 $('#tot').innerHTML=items.length?`<div><small>${esc(T.from)}</small>${od&&sum?`<small>${esc(T.onRequest)}</small>`:''}</div><b>${sum?esc(T.fromNote)+' '+nf(sum)+' Kz':esc(items[0].price)}</b>`:'';
 validate(false);
}
const phoneOk=v=>{const d=v.replace(/\D/g,'');return(d.length===9&&d[0]==='9')||(d.length>=10&&d.length<=15)};
function updFab(){
 const ok=quote.length&&$('#cn').value.trim().length>2&&phoneOk($('#cp').value.trim());
 $('#fab').hidden=!(ok&&page!=='orcamento');$('#fabt').textContent=T.btnSendWhats||'';
}
function validate(show){
 const n=$('#cn').value.trim(),p=$('#cp').value.trim(),nOk=n.length>2,pOk=phoneOk(p);
 $('#ep').textContent=p&&!pOk?T.phoneErr:'';$('#cp').classList.toggle('bad',!!p&&!pOk);
 if(show===true){$('#en').textContent=!nOk&&n?T.nameErr:'';$('#cn').classList.toggle('bad',!!n&&!nOk)}
 ls.set('mm_form',{n,p});
 const box=$('#send');
 if(quote.length&&nOk&&pOk){if(!$('#fin')){box.innerHTML=`<button class="b2 wa" id="fin">${ic('chat')}<span>${esc(T.btnSendWhats)}</span></button>`;$('#fin').onclick=send}else $('#fin span').textContent=T.btnSendWhats}
 else box.innerHTML=`<div class="lock">${ic('lock')}<span>${esc(T.secureWait)}</span></div>`;
 updFab();
}
function send(){
 const n=$('#cn').value.trim(),p=$('#cp').value.trim(),d=$('#cd').value.trim(),t=tiers();
 let m=`*PROPOSTA TÉCNICA - MUNDO MARTINHO*\n\n*Cliente:* ${n}\n*Contacto:* ${p}\n`;
 if(d)m+=`*Briefing:* ${d}\n`;
 m+=`\n*Soluções Selecionadas:*\n`+quote.map(id=>{const s=SV.find(x=>x.id===id);return `- ${s.name} (${s.price})`}).join('\n')+'\n';
 if(t.un.length)m+=`\n*PRÉMIOS A ATIVAR:*\n`+t.un.map(r=>`- ${r.pt}`).join('\n')+'\n';
 const from=ls.get('mm_from',''),src=ls.get('mm_src','');
 if(from&&from!==myRef)m+=`\n*Indicado por:* ${from}`;
 m+=`\n*O meu código:* ${myRef}`;if(src)m+=`\n*Origem:* ${src}`;
 m+=`\n\n*Nota:* Aguardo validação técnica e cronograma.`;
 window.open(wa(m),'_blank','noopener');
 toast(T.sent,'chat');quote=[];ls.set('mm_quote',[]);$('#cd').value='';lastTier=0;renderGrid();renderQuote();go('servicos');
}
const shareUrl=()=>`${C.siteUrl}/?ref=${myRef}&src=share`;
async function copyText(v){try{await navigator.clipboard.writeText(v);return true}catch{const i=$('#shurl');i.select();try{return document.execCommand('copy')}catch{return false}}}
function openShare(){
 const u=shareUrl(),t=T.shareText,e=encodeURIComponent,q=$('#qrimg');
 if(!q.getAttribute('src'))q.src='qr.png';$('#shurl').value=u;
 const web=[['WhatsApp','#25d366','chat',`https://wa.me/?text=${e(t+' '+u)}`],['Facebook','#1877f2','f',`https://www.facebook.com/sharer/sharer.php?u=${e(u)}`],['X','#000','X',`https://x.com/intent/post?text=${e(t)}&url=${e(u)}`],['Telegram','#2aabee','paper',`https://t.me/share/url?url=${e(u)}&text=${e(t)}`],['LinkedIn','#0a66c2','in',`https://www.linkedin.com/sharing/share-offsite/?url=${e(u)}`]];
 const app=[['Email','#64748b','mail',`mailto:?subject=${e('Mundo Martinho')}&body=${e(t+'\n'+u)}`],['SMS','#10b981','msg',`sms:?&body=${e(t+' '+u)}`]];
 const gl=i=>['chat','paper','msg','mail','camera','share'].includes(i)?ic(i):i;
 const a=([n,c,i,hr],ext)=>`<a class="shb" href="${esc(hr)}"${ext?' target="_blank" rel="noopener"':''}><span style="background:${c}">${gl(i)}</span>${n}</a>`;
 const cp=(n,c,i,go)=>`<button class="shb" data-cp="1" data-go="${go}"><span style="background:${c}">${gl(i)}</span>${n}</button>`;
 $('#shg').innerHTML=web.slice(0,2).map(x=>a(x,1)).join('')+cp('Instagram','linear-gradient(45deg,#f09433,#dc2743,#bc1888)','camera','https://www.instagram.com/')+web.slice(2).map(x=>a(x,1)).join('')+cp('TikTok','#000','♪','https://www.tiktok.com/')+app.map(x=>a(x,0)).join('')+(navigator.share?`<button class="shb" data-nat="1"><span style="background:#6366f1">${ic('share')}</span>${esc(T.shareMore)}</button>`:'');
 $('#sh').showModal();
}
function go(p){location.hash=p}
function route(){
 const h=location.hash.slice(1);page=['servicos','anuncios','projetos','orcamento'].includes(h)?h:'servicos';
 $$('.page').forEach(e=>e.classList.toggle('on',e.id==='p-'+page));
 $$('[data-p]').forEach(b=>page===b.dataset.p?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
 if(C.translations&&page==='orcamento')renderQuote();
 updFab();
 scrollTo({top:0,behavior:'smooth'});
}
addEventListener('hashchange',route);
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-p],[data-l],[data-c],[data-pc],[data-a],[data-r],[data-z],[data-cp],[data-nat]');if(!b)return;
 if(b.dataset.p)go(b.dataset.p);
 else if(b.dataset.l){lang=b.dataset.l;ls.set('mm_lang',lang);applyLang()}
 else if(b.dataset.c){cat=b.dataset.c;$$('.cat').forEach(x=>x.classList.toggle('on',x===b));renderGrid()}
 else if(b.dataset.cp){copyText(shareUrl()).then(()=>toast(T.shareIg,'copy'));window.open(b.dataset.go,'_blank','noopener')}
 else if(b.dataset.nat)navigator.share({title:'Mundo Martinho',text:T.shareText,url:shareUrl()}).catch(()=>{});
 else if(b.dataset.pc){pcat=b.dataset.pc;renderShowcase()}
 else if(b.dataset.a||b.dataset.r)toggle(+(b.dataset.a||b.dataset.r));
 else if(b.dataset.z){const l=$('#lb');l.querySelector('img').src=b.dataset.z;l.showModal()}
});
document.addEventListener('error',e=>{const t=e.target;if(t.tagName==='IMG'&&t.hasAttribute('data-fb')){const d=document.createElement('div');d.className='ph';d.innerHTML=ic('globe');t.replaceWith(d)}},true);
$('#lb').addEventListener('click',()=>$('#lb').close());
['input','change'].forEach(ev=>{$('#cn').addEventListener(ev,()=>validate(true));$('#cp').addEventListener(ev,()=>validate(true))});
$('#refBtn').addEventListener('click',openShare);
$('#shcopy').addEventListener('click',async()=>{if(await copyText(shareUrl()))toast(T.shareCopied,'copy')});
$('#sh').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
let dip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('#inst').hidden=false});
$('#inst').addEventListener('click',()=>{if(dip){dip.prompt();dip=null;$('#inst').hidden=true}});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
{const f=ls.get('mm_form',{});$('#cn').value=f.n||'';$('#cp').value=f.p||''}
load();
</script>
</body>
</html>
